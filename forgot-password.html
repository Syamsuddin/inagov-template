<!DOCTYPE html>
<html lang="id" data-theme="light" data-brand="hss">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Permohonan reset kata sandi via email atau NIP dinas — Portal Terpadu Pemkab HSS">
  <title>Lupa Kata Sandi — Portal Terpadu Pemkab HSS</title>
  <link rel="stylesheet" href="assets/idds-tokens.css">
  <link rel="stylesheet" href="assets/idds-utilities.css">
  <link rel="stylesheet" href="assets/idds-admin.css">
</head>
<body class="ina-auth-page">
  <button type="button" class="ina-icon-btn ina-auth-theme-toggle" data-toggle-theme aria-label="Ganti Mode Gelap/Terang">
    <svg class="ina-icon ina-icon-20 ina-icon-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"/></svg>
    <svg class="ina-icon ina-icon-20 ina-icon-sun" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0M3 12h1M20 12h1M12 3v1M12 20v1M5.6 5.6l.7 .7M17.7 17.7l.7 .7M5.6 18.4l.7 -.7M17.7 6.3l.7 -.7"/></svg>
  </button>

  <div class="ina-auth-box">
    <div class="ina-auth-header">
      <div class="ina-brand-logo ina-brand-logo-lg">HSS</div>
      <h1 class="ina-h4 ina-mt-1">Pemulihan Kata Sandi</h1>
      <p class="ina-caption ina-text-muted">Masukkan email dinas atau NIP untuk menerima kode verifikasi.</p>
    </div>

    <form class="ina-auth-form" onsubmit="event.preventDefault(); window.location.href='otp.html';">
      <div class="ina-form-group">
        <label class="ina-form-label" for="fpUser">Email Dinas atau NIP <span class="ina-form-required">*</span></label>
        <div class="ina-input-group">
          <svg class="ina-icon ina-icon-20 ina-input-icon-left" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg>
          <input type="text" class="ina-input ina-input-with-icon-left" id="fpUser" placeholder="19880412... atau nama@hulusungaiselatankab.go.id" required autocomplete="username">
        </div>
      </div>
      <fieldset class="ina-form-group" style="border:none;">
        <legend class="ina-form-label">Kirim kode melalui</legend>
        <div class="ina-flex-col ina-gap-2 ina-mt-1">
          <label class="ina-radio-label"><input type="radio" name="fpVia" class="ina-radio" checked><span>Email dinas terdaftar</span></label>
          <label class="ina-radio-label"><input type="radio" name="fpVia" class="ina-radio"><span>WhatsApp dinas <span class="ina-tabular ina-text-muted">(0812 **** **56)</span></span></label>
          <label class="ina-radio-label"><input type="radio" name="fpVia" class="ina-radio"><span>Aplikasi ASN Digital</span></label>
        </div>
      </fieldset>
      <div class="ina-alert ina-alert-info">
        <svg class="ina-icon ina-icon-20" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M12 3a9 9 0 1 0 9 9a9 9 0 0 0 -9 -9"/></svg>
        <div class="ina-alert-content"><div class="ina-alert-desc">Kode berlaku 10 menit. Bila tidak menerima kode, hubungi admin SKPD atau helpdesk Diskominfo.</div></div>
      </div>
      <button type="submit" class="ina-btn ina-btn-primary ina-btn-lg ina-w-full">
        <span>Kirim kode verifikasi</span>
      </button>
      <a href="login.html" class="ina-btn ina-btn-tertiary ina-btn-md ina-w-full">
        <svg class="ina-icon ina-icon-16" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12l14 0M5 12l6 6M5 12l6 -6"/></svg>
        <span>Kembali ke halaman masuk</span>
      </a>
    </form>
  </div>

  <script src="assets/idds-admin.js"></script>
</body>
</html>
